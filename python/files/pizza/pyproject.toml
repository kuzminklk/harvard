[project]
name = "pizza"
version = "0.1.0"
description = "Print a table in ASCII-art from .csv file"
readme = "README.md"
authors = [{ name = "kuzminkdk", email = "kuzminkdk@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["tabulate>=0.10.0"]

[project.scripts]
pizza = "pizza:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
