[project]
name = "figlet"
version = "0.1.0"
description = "Turn text into ASCII-art"
readme = "README.md"
authors = [{ name = "kuzminkdk", email = "kuzminkdk@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["pyfiglet>=1.0.4"]

[project.scripts]
figlet = "figlet:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
